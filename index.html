<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Outlaws" />
    <meta name="theme-color" content="#050d05" />
    <meta name="description" content="Outlaws Platoon Fleet Maintenance Tracker" />

    <!-- PWA Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <title>Outlaws Tracker</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html {
        background: #050d05;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: #050d05;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        touch-action: manipulation;
      }
      #root { background: #050d05; min-height: 100vh; }
      * { -webkit-tap-highlight-color: transparent; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW failed:', err));
        });
      }
    </script>
  </body>
</html>
